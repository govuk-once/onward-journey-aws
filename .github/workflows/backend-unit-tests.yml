name: Backend Unit Tests

on:
  workflow_call:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'conftest.py'
      - '.github/workflows/backend-unit-tests.yml'

jobs:
  unit-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --all-extras
      - name: Run unit tests
        run: uv run pytest app/tests/unit
