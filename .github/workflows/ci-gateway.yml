name: CI Gateway

on:
  pull_request:

jobs:
  run-frontend:
    uses: ./.github/workflows/frontend-checks.yml

  run-infrastructure:
    uses: ./.github/workflows/terraform-checks.yml

  run-backend:
    uses: ./.github/workflows/backend-unit-tests.yml

  all-checks-passed:
    name: "All CI Checks Passed"
    needs: [run-frontend, run-infrastructure, run-backend]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all upstream statuses
        run: |
          if [ "${{ needs.run-frontend.result }}" != "success" ]; then
            echo "Frontend checks failed!"
            exit 1
          fi

          if [ "${{ needs.run-infrastructure.result }}" != "success" ]; then
            echo "Terraform checks failed!"
            exit 1
          fi

          if [ "${{ needs.run-backend.result }}" != "success" ]; then
            echo "Backend checks failed!"
            exit 1
          fi

          echo "All required checks passed!"
