name: CI Gateway

on:
  pull_request:
  push:
    branches:
      - automate-unit-tests

jobs:
  # Detect what files changed in this PR. output boolean values for each filter.
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      infrastructure: ${{ steps.filter.outputs.infrastructure }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/workflows/frontend-checks.yml'
            infrastructure:
              - 'infrastructure/**'
              - '.github/workflows/terraform-checks.yml'
            backend:
              - 'app/**'
              - '.github/workflows/backend-unit-tests.yml'

# run the workflows for each of the changed components. If a component has no changes, skip its workflow.
  run-frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    uses: ./.github/workflows/frontend-checks.yml

  run-infrastructure:
    needs: changes
    if: needs.changes.outputs.infrastructure == 'true'
    uses: ./.github/workflows/terraform-checks.yml

  run-backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    uses: ./.github/workflows/backend-unit-tests.yml

  all-checks-passed:
    name: "All CI Checks Passed"
    needs: [changes, run-frontend, run-infrastructure, run-backend]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all upstream statuses # update 'run' to include backend when implemented
        run: |
          FRONTEND_STATUS="${{ needs.run-frontend.result }}"
          INFRA_STATUS="${{ needs.run-infrastructure.result }}"
          BACKEND_STATUS="${{ needs.run-backend.result }}"

          echo "Frontend status: $FRONTEND_STATUS"
          echo "Infrastructure status: $INFRA_STATUS"
          echo "Backend status: $BACKEND_STATUS"

          if [ "$FRONTEND_STATUS" = "failure" ] || [ "$FRONTEND_STATUS" = "cancelled" ]; then
            echo "Frontend checks failed!"
            exit 1
          fi

          if [ "$INFRA_STATUS" = "failure" ] || [ "$INFRA_STATUS" = "cancelled" ]; then
            echo "Terraform checks failed!"
            exit 1
          fi

          if [ "$BACKEND_STATUS" = "failure" ] || [ "$BACKEND_STATUS" = "cancelled" ]; then
            echo "Backend checks failed!"
            exit 1
          fi

          echo "All required checks passed or were safely skipped!"
