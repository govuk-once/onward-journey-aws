[project]
name = "onward-journey"
version = "0.1.0"
description = "GOV.UK Onward Journey backend"
readme = "README.md"
requires-python = ">=3.12"
# Shared packages needed by BOTH Lambdas and the AgentCore runtime (will change when orchestrator lambda removed)
dependencies = [
    "langchain-aws>=1.2.2",
    "langgraph>=0.2.60",
    "langchain-core>=1.3.3",
    "langgraph-checkpoint-aws>=1.0.4",
]

[project.optional-dependencies]
# Packages needed ONLY by the Lambdas
lambdas = [
    "pg8000>=1.31.2",
]
# Packages needed ONLY by OJ AgentCore Runtime
agentcore = [
    "bedrock-agentcore>=1.20.0",
    "mcp-proxy-for-aws>=1.6.4",
    "mcp>=1.29.0",
    "httpx>=0.28.1",
]

[tool.setuptools]
packages = ["shared", "lambdas", "agentcore"]

[dependency-groups]
dev = [
    "boto3>=1.42.5",         # Pre-installed in Lambda, keep here for local IDE/Linting
    "pytest>=7.0.0",
    "deepeval>=4.0.7",
    "aiobotocore",
    "botocore"
]

[tool.pytest.ini_options]
filterwarnings = [
    # Silences the LangChain/Pydantic V1 compatibility warning on Python 3.14+
    "ignore:Core Pydantic V1 functionality isn't compatible with Python:UserWarning"
]
addopts = "--tb=short"
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)s] %(message)s"
log_cli_date_format = "%H:%M:%S"
